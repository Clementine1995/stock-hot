<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stock-hot · A股金融热点</title>
<style>
  :root {
    --up: #e03131;
    --up-name: #c0392b;
    --down: #0ca678;
    --down-name: #6b7280;
    --hl-bg: #fff3bf;
    --hl-line: #f08c00;
    --line: #e6e3dc;
    --bg: #f5f3ef;
    --card: #ffffff;
    --text: #2b2a28;
    --muted: #9a958c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--text); background: var(--bg);
  }

  /* 顶部导航 */
  header.topbar {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 10px 20px; position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .brand { font-size: 16px; font-weight: 800; }
  .brand .dot { color: var(--up); }
  .brand .sub { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  nav.tabs { display: flex; gap: 4px; }
  .tab {
    font: inherit; font-size: 13px; padding: 6px 14px; cursor: pointer;
    border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--muted);
  }
  .tab.active { background: #fff; border-color: var(--line); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .status { font-size: 12px; color: var(--muted); }
  .status.ok { color: var(--down); }
  .status.err { color: var(--up); }
  button.refresh {
    font: inherit; font-size: 13px; padding: 7px 16px; cursor: pointer;
    background: #f08c00; color: #fff; border: none; border-radius: 7px; font-weight: 600;
  }
  button.refresh:disabled { opacity: .6; cursor: default; }

  .tab-panel { display: none; padding: 14px 20px; }
  .tab-panel.active { display: block; }
  .empty-tip { padding: 60px 20px; text-align: center; color: var(--muted); font-size: 14px; }

  /* 面板工具条（轮动） */
  .panel-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .panel-toolbar .stats { font-size: 12px; color: var(--muted); }
  .panel-toolbar .controls { margin-left: auto; display: flex; gap: 8px; }
  .panel-toolbar input[type=search], .panel-toolbar select {
    font: inherit; font-size: 12px; padding: 5px 10px;
    border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--text);
  }
  .panel-toolbar input[type=search] { width: 150px; }
  .hint { font-size: 11px; color: var(--muted); }

  /* 日历墙 */
  main#grid {
    display: grid;
    grid-template-columns: repeat(8, minmax(118px, 1fr));
    gap: 8px; align-items: start;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .card-head {
    padding: 6px 8px; font-weight: 700; font-size: 12px; text-align: center;
    background: #faf9f6; border-bottom: 1px solid var(--line); letter-spacing: .5px;
  }
  .entries { padding: 4px 6px 6px; }
  .entry {
    display: flex; align-items: center; gap: 4px;
    padding: 2px 3px; margin: 1px 0; border-radius: 4px; font-size: 11px;
    cursor: pointer; border: 1px solid transparent; user-select: none; line-height: 1.35;
  }
  .entry .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .val { font-weight: 700; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .entry.strong .nm { color: var(--up-name); }
  .entry.strong .val { color: var(--up); }
  .entry.weak .nm { color: var(--down-name); }
  .entry.weak .val { color: var(--down); }
  .entry.hl { background: var(--hl-bg); border-color: var(--hl-line); }
  .divider { font-size: 10px; color: var(--muted); margin: 4px 3px 2px; padding-top: 3px; border-top: 1px dashed var(--line); }

  /* 底部详情 + 轨迹 */
  footer#detail {
    position: sticky; bottom: 0; background: var(--card);
    border-top: 2px solid var(--line); padding: 10px 20px 14px; z-index: 30;
    display: none; gap: 24px; align-items: flex-start; flex-wrap: wrap;
  }
  footer#detail.show { display: flex; }
  #detail-panel { min-width: 180px; }
  .dp-title { font-size: 15px; font-weight: 700; }
  .dp-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .dp-meta .u { color: var(--up); font-weight: 700; }
  .dp-meta .d { color: var(--down); font-weight: 700; }
  .dp-meta b { color: var(--text); }
  #timeline { flex: 1; min-width: 260px; }
  .tl-label { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
  #tl-cells { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 4px; }
  .tcell { flex: 0 0 52px; text-align: center; padding: 4px 2px 3px; border-radius: 5px; color: #fff; line-height: 1.25; }
  .tcell.up { background: var(--up); }
  .tcell.down { background: var(--down); }
  .tcell.empty { background: #e5e1d8; color: #a8a198; }
  .tcell .td { display: block; font-size: 9px; opacity: .92; }
  .tcell .tv { display: block; font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* 温度面板 */
  .mood-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; }
  .mood-current { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .temp-big { font-size: 60px; font-weight: 800; line-height: 1; }
  .temp-state { font-size: 18px; font-weight: 700; }
  .temp-date { font-size: 13px; color: var(--muted); }
  .thermo-bar { height: 16px; border-radius: 8px; position: relative; margin: 8px 0 4px;
    background: linear-gradient(to right, #0ca678 0%, #0ca678 40%, #f08c00 60%, #e03131 100%); }
  .thermo-marker { position: absolute; top: -5px; width: 4px; height: 26px; background: #1f2933; border-radius: 2px; transform: translateX(-50%); }
  .thermo-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .mood-note { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .mood-card h2 { margin: 0 0 12px; font-size: 14px; color: #4d5967; }
  .chart-wrap { width: 100%; max-width: 960px; }
  .mood-legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-size: 11px; color: var(--muted); margin: 10px 0 4px; }
  .mood-legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .mood-legend .count { margin-left: auto; }
  .mood-stats { display: flex; gap: 30px; flex-wrap: wrap; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .mood-stat .k { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .mood-stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .mood-stat .v.up { color: var(--up); }
  .mood-stat .v.down { color: var(--down); }
  .mood-stat .v.flat { color: var(--text); }

  /* 连板梯队 */
  .ladder-rung { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px dashed #f0ede6; }
  .ladder-rung:last-child { border-bottom: none; }
  .ladder-board { flex-shrink: 0; min-width: 40px; font-size: 16px; font-weight: 800; color: var(--up); font-variant-numeric: tabular-nums; }
  .ladder-board .b-unit { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 1px; }
  .ladder-stocks { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; }
  .ladder-chip { display: inline-flex; align-items: center; gap: 5px; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 12px; }
  .ladder-chip .lc-name { font-weight: 600; }
  .ladder-chip .lc-code { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
  .ladder-empty { color: var(--muted); font-size: 13px; padding: 6px 0; }

  /* 严重异动（偏离值预警） */
  .abn-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px dashed #f0ede6; }
  .abn-item:last-child { border-bottom: none; }
  .abn-left { flex: 1; min-width: 0; }
  .abn-name { font-size: 13px; font-weight: 600; }
  .abn-code { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; margin-left: 4px; }
  .abn-reason { font-size: 11px; color: #4d5967; margin-top: 3px; line-height: 1.4; }
  .abn-right { flex-shrink: 0; text-align: right; }
  .abn-dev { font-size: 15px; font-weight: 800; color: var(--up); font-variant-numeric: tabular-nums; }
  .abn-dev .d-unit { font-size: 11px; font-weight: 400; color: var(--muted); }
  .abn-trigger { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .abn-empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
  .chart-tip { position: fixed; z-index: 100; pointer-events: none; background: #23272e; color: #fff;
    font-size: 12px; line-height: 1.5; padding: 7px 11px; border-radius: 7px;
    box-shadow: 0 6px 18px rgba(0,0,0,.25); display: none; white-space: nowrap; }
  .chart-tip b { font-size: 12px; }

  /* 报表 */
  .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .r-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .r-card h2 { margin: 0 0 10px; font-size: 14px; color: #4d5967; }
  .r-card h2 .sub { font-size: 11px; font-weight: 400; color: var(--muted); }
  .kv { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
  .kv .k { color: var(--muted); }
  .kv .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .rank-list { margin: 0; padding: 0; list-style: none; }
  .rank-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 3px 0; font-size: 13px; border-bottom: 1px dashed #f0ede6; }
  .rank-list li:last-child { border-bottom: none; }
  .rank-list .rnm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .rank-list .rnm .rcode { color: var(--muted); font-size: 10px; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .rank-list .rval { font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .rank-list .rval.up { color: var(--up); }
  .rank-list .rval.down { color: var(--down); }
  .rank-list .rval.flat { color: var(--muted); }

  /* 每日点评 */
  .review-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px; margin-bottom: 16px; }
  .review-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .review-title { font-size: 15px; font-weight: 800; }
  .review-title .tag { font-size: 11px; color: var(--up); font-weight: 700; border: 1px solid var(--up); border-radius: 4px; padding: 1px 5px; margin-left: 6px; }
  .review-btn {
    margin-left: auto; font: inherit; font-size: 12px; padding: 6px 14px; cursor: pointer;
    background: #f08c00; color: #fff; border: none; border-radius: 6px; font-weight: 600;
  }
  .review-btn:disabled { opacity: .6; cursor: default; }
  .review-body { font-size: 14px; line-height: 1.85; color: var(--text); white-space: pre-wrap; }
  .review-body.placeholder { color: var(--muted); font-size: 13px; }
  .review-meta { font-size: 11px; color: var(--muted); margin-top: 8px; }

  /* 市场情绪总览 */
  .ov-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; margin-bottom: 16px; }
  .ov-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .ov-title { font-size: 15px; font-weight: 800; }
  .ov-date { font-size: 12px; color: var(--muted); }
  .ov-grid { display: flex; gap: 32px; flex-wrap: wrap; align-items: center; }
  .ov-temp { display: flex; align-items: baseline; gap: 12px; min-width: 180px; }
  .ov-temp .num { font-size: 48px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .ov-temp .state { font-size: 15px; font-weight: 700; }
  .ov-item .k { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .ov-item .v { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .ov-item .v.up { color: var(--up); }
  .ov-item .v.down { color: var(--down); }
  .ov-item .v.flat { color: var(--text); }
  .ov-item .v small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 3px; }

  /* 主线榜（报表内精简） */
  .mainline-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; cursor: pointer; border-bottom: 1px dashed #f0ede6; }
  .mainline-row:last-child { border-bottom: none; }
  .mainline-row:hover { background: #fbf8f1; }
  .mainline-row .ml-dots { display: inline-flex; gap: 3px; flex-shrink: 0; }
  .mainline-row .ml-dots .dot { width: 7px; height: 7px; border-radius: 2px; background: #ece9e2; }
  .mainline-row .ml-dots .dot.on { background: var(--up); }
  .mainline-row .ml-nm { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mainline-row .ml-cnt { font-weight: 800; color: var(--up); font-variant-numeric: tabular-nums; flex-shrink: 0; }

  /* 领涨个股榜 */
  .stock-rank li { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; border-bottom: 1px dashed #f0ede6; }
  .stock-rank li:last-child { border-bottom: none; }
  .stock-rank .sr-code { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .stock-rank .sr-nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .stock-rank .sr-tag { font-size: 10px; color: #fff; background: var(--up); border-radius: 4px; padding: 1px 5px; flex-shrink: 0; }
  .stock-rank .sr-val { font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .stock-rank .sr-val.up { color: var(--up); }
  .stock-rank .sr-val.down { color: var(--down); }

  /* 票池 */
  .pool-note { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .pool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .pool-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .pool-head { font-size: 15px; font-weight: 700; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 8px; }
  .pool-head .cnt { font-size: 12px; color: var(--muted); font-weight: 400; }
  .pool-sec { margin-bottom: 10px; }
  .pool-sec:last-child { margin-bottom: 0; }
  .pool-sec-title { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .pool-sec-title.lead { color: var(--up); }
  .pool-sec-title.gen { color: #1c7ed6; }
  .pool-stock { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 13px; }
  .pool-stock .scode { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .pool-stock .sname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pool-stock .stag { font-size: 10px; color: #fff; background: var(--up); border-radius: 4px; padding: 1px 5px; flex-shrink: 0; }
  .pool-stock .sval { font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .pool-stock .sval.up { color: var(--up); }
  .pool-stock .sval.down { color: var(--down); }

  /* 近10日高频板块 —— 桌面专业榜单 */
  .freq-board {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 20px 10px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .freq-board-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .freq-board-title { font-size: 16px; font-weight: 800; letter-spacing: .3px; }
  .freq-board-title .hl-tag { color: var(--up); }
  .freq-board-sub { font-size: 12px; color: var(--muted); }
  .freq-board-meta { font-size: 12px; color: var(--muted); margin-left: auto; }
  .freq-board-meta b { color: var(--up); font-weight: 800; }

  .freq-table { width: 100%; border-collapse: collapse; }
  .freq-table thead th {
    font-size: 11px; font-weight: 600; color: var(--muted); text-align: right;
    padding: 0 12px 8px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  .freq-table thead th.c-rank { text-align: center; width: 54px; }
  .freq-table thead th.c-plate { text-align: left; }
  .freq-table thead th.c-dots { text-align: center; width: 150px; }
  .freq-table thead th.c-cnt { width: 92px; }
  .freq-table thead th.c-str { width: 96px; }

  .freq-table tbody td { padding: 10px 12px; border-bottom: 1px solid #f3f0ea; vertical-align: middle; }
  .freq-table tbody tr { cursor: pointer; transition: background .1s; }
  .freq-table tbody tr:hover { background: #fbf8f1; }
  .freq-table tbody tr.active { background: var(--hl-bg); }
  .freq-table tbody tr:last-child td { border-bottom: none; }

  .rank-badge {
    display: inline-flex; width: 26px; height: 26px; border-radius: 6px;
    align-items: center; justify-content: center; font-weight: 800; font-size: 13px;
    color: #fff; background: #d3cec4; font-variant-numeric: tabular-nums;
  }
  .rank-badge.r1 { background: var(--up); box-shadow: 0 2px 6px rgba(224,49,49,.28); }
  .rank-badge.r2 { background: #f0a020; box-shadow: 0 2px 6px rgba(240,160,32,.25); }
  .rank-badge.r3 { background: #8a95a1; }

  .freq-plate { display: block; }
  .freq-name { font-weight: 700; font-size: 14px; }
  .freq-name .code { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .freq-lead { font-size: 11px; color: #9a958c; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
  .freq-lead .lbl { color: var(--muted); }
  .freq-lead .nm { color: #6b7280; }

  .freq-dots { display: inline-flex; align-items: center; gap: 4px; }
  .freq-dots .dot { width: 9px; height: 9px; border-radius: 2px; background: #ece9e2; }
  .freq-dots .dot.on { background: var(--up); }

  .freq-cnt { font-weight: 800; font-size: 18px; color: var(--up); text-align: right; font-variant-numeric: tabular-nums; }
  .freq-cnt .unit { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 2px; }

  .freq-strength { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
  .freq-strength.up { color: var(--up); }
  .freq-strength.down { color: var(--down); }
  .freq-strength.flat { color: var(--muted); }

  /* 高频板块走势图 —— 点击行下方展开 */
  .freq-table tr.trend-row { cursor: default; }
  .freq-table tr.trend-row:hover { background: transparent; }
  .freq-table tr.trend-row td { padding: 6px 14px 16px; background: #fbfaf7; border-bottom: 1px solid #f3f0ea; }
  .trend-wrap { padding: 8px 4px 2px; }
  .trend-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .trend-title { font-size: 13px; font-weight: 700; }
  .trend-title .tag { color: var(--muted); font-weight: 400; font-size: 11px; margin-left: 6px; }
  .trend-legend { margin-left: auto; display: flex; align-items: center; gap: 16px; font-size: 11px; color: var(--muted); }
  .trend-legend .lg-bar { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
  .trend-legend .lg-bar.bar { background: var(--up); }
  .trend-legend .lg-bar.down { background: var(--down); }
  .trend-legend .lg-line { display: inline-block; width: 14px; height: 2px; background: var(--hl-line); vertical-align: 3px; margin-right: 4px; }
  .trend-pool-btn {
    margin-left: auto; font-size: 11px; font-weight: 600; color: var(--hl-line);
    border: 1px solid var(--hl-line); background: #fff; border-radius: 6px;
    padding: 3px 10px; cursor: pointer; white-space: nowrap; line-height: 1.4;
  }
  .trend-pool-btn:hover { background: var(--hl-bg); }
  .trend-chart { width: 100%; display: block; }
  .trend-empty { font-size: 12px; color: var(--muted); padding: 10px 4px; }


  /* 每日题材轮动明细 —— 折叠收起，让位给高频板块 */
  .daily-collapse { margin-bottom: 8px; }
  .daily-toggle {
    width: 100%; display: flex; align-items: center; gap: 8px; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 14px; font: inherit; font-size: 13px; color: var(--text); text-align: left;
  }
  .daily-toggle:hover { border-color: var(--hl-line); }
  .daily-toggle .t-title { font-weight: 700; }
  .daily-toggle .t-count { color: var(--muted); font-size: 12px; }
  .daily-toggle .t-arrow { margin-left: auto; transition: transform .2s; color: var(--muted); }
  .daily-toggle.open .t-arrow { transform: rotate(180deg); }

  /* 核心票抽屉 */
  .drawer-mask { position: fixed; inset: 0; background: rgba(0,0,0,.28); z-index: 90; display: none; }
  .drawer-mask.show { display: block; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 460px; max-width: 92vw;
    background: var(--bg); z-index: 91; box-shadow: -6px 0 24px rgba(0,0,0,.18);
    transform: translateX(100%); transition: transform .22s ease; display: flex; flex-direction: column;
  }
  .drawer.show { transform: translateX(0); }
  .drawer-head { padding: 14px 18px; background: var(--card); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .drawer-head .d-title { font-size: 16px; font-weight: 800; flex: 1; }
  .drawer-head .d-sub { font-size: 12px; color: var(--muted); }
  .drawer-close { font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); padding: 2px 8px; border: none; background: transparent; }
  .drawer-close:hover { color: var(--text); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 14px 18px; }
  .drawer-loading { text-align: center; color: var(--muted); padding: 40px 0; font-size: 13px; }
  .d-sec { margin-bottom: 16px; }
  .d-sec-title { font-size: 13px; font-weight: 800; margin-bottom: 8px; padding-left: 8px; border-left: 3px solid; }
  .d-sec-title.lead { border-color: var(--up); color: var(--up); }
  .d-sec-title.gen { border-color: #1c7ed6; color: #1c7ed6; }
  .d-stock { display: flex; align-items: center; gap: 8px; padding: 7px 8px; margin-bottom: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
  .d-stock .scode { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .d-stock .sname { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .d-stock .stag { font-size: 10px; color: #fff; background: var(--up); border-radius: 4px; padding: 1px 5px; flex-shrink: 0; }
  .d-stock .sval { font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .d-stock .sval.up { color: var(--up); }
  .d-stock .sval.down { color: var(--down); }
  .d-stock .sval.flat { color: var(--muted); }

  /* ===== 移动端适配 ===== */
  @media (max-width: 768px) {
    html, body { overflow-x: hidden; }

    /* 顶部导航：压缩 + tabs 独立成行横向滚动 */
    header.topbar { padding: 8px 12px; gap: 8px; }
    .brand { font-size: 15px; }
    .brand .sub { display: none; }
    nav.tabs { order: 3; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    nav.tabs::-webkit-scrollbar { display: none; }
    .tab { flex-shrink: 0; white-space: nowrap; padding: 6px 12px; }
    .actions { margin-left: auto; }
    .status { display: none; }
    button.refresh { padding: 7px 12px; white-space: nowrap; }

    /* 面板通用 */
    .tab-panel { padding: 10px 12px; }

    /* 日历墙：自动换列，消除横向溢出 */
    main#grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
    .card-head { font-size: 11px; }
    .entry { font-size: 10px; }

    /* 高频板块表格：移动端隐藏节奏图列，保留核心数字列，避免「上榜次数/最新强度」被挤出屏 */
    .freq-board { overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 14px 14px 8px; }
    .freq-table { min-width: 351px; }
    .freq-table thead th.c-dots { display: none; }
    .freq-table tbody td:nth-child(3) { display: none; }
    .freq-table thead th.c-rank { width: 40px; }
    .freq-table thead th.c-cnt { width: 68px; }
    .freq-table thead th.c-str { width: 80px; }

    /* 展开的走势行：走势图与核心票按钮铺满手机屏宽，不被表格横向滚动带出视野 */
    .freq-table tr.trend-row td { padding: 6px 12px 16px; }
    .trend-wrap { max-width: calc(100vw - 48px); }
    .trend-head { flex-wrap: wrap; gap: 8px; }
    .trend-title { flex: 1 1 100%; }
    .trend-legend { margin-left: 0; }
    .trend-pool-btn { margin-left: 0; }

    /* 报表 / 票池：单列铺满 */
    .report-grid { grid-template-columns: 1fr; }
    .pool-grid { grid-template-columns: 1fr; }

    /* 卡片内边距收紧 */
    .mood-card, .ov-card, .review-card, .r-card { padding: 14px 14px; }
    .temp-big { font-size: 44px; }
    .ov-temp .num { font-size: 36px; }

    /* 底部详情：纵向排列，时间轴满宽 */
    footer#detail { flex-direction: column; gap: 10px; padding: 10px 12px 14px; }
    #detail-panel { min-width: 0; }
    #timeline { min-width: 0; width: 100%; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot">●</span> stock-hot<span class="sub">A股金融热点</span></div>
  <nav class="tabs">
    <button class="tab active" data-tab="wheel">题材轮动</button>
    <button class="tab" data-tab="mood">情绪温度</button>
    <button class="tab" data-tab="report">数字报表</button>
    <button class="tab" data-tab="stock">核心票池</button>
  </nav>
  <div class="actions">
    <span id="status" class="status">加载中…</span>
    <button id="refresh" class="refresh">刷新数据</button>
  </div>
</header>

<section id="tab-wheel" class="tab-panel active">
  <div id="freq-board" style="margin-top:4px"></div>
  <div class="daily-collapse">
    <button class="daily-toggle open" id="daily-toggle" type="button">
      <span class="t-title">每日题材轮动明细</span>
      <span class="t-count" id="daily-count">—</span>
      <span class="t-arrow">▾</span>
    </button>
    <div id="daily-body">
      <div class="panel-toolbar" style="margin-top:12px">
        <span class="stats" id="wheel-stats">—</span>
        <div class="controls">
          <input id="search" type="search" placeholder="搜索题材…">
          <select id="filter">
            <option value="all">全部</option>
            <option value="strong">强势</option>
            <option value="weak">弱势</option>
          </select>
        </div>
      </div>
      <div class="hint" style="margin-bottom:10px">点击任意题材 → <b>同名题材自动高亮</b>并生成轮动轨迹 · <b style="color:var(--up)">红=走强</b> · <b style="color:var(--down)">绿=走弱</b></div>
      <main id="grid"><div class="empty-tip">加载中…</div></main>
    </div>
  </div>
</section>

<section id="tab-mood" class="tab-panel"><div class="empty-tip">加载中…</div></section>
<section id="tab-report" class="tab-panel"><div class="empty-tip">加载中…</div></section>
<section id="tab-stock" class="tab-panel"><div class="empty-tip">加载中…</div></section>

<footer id="detail">
  <div id="detail-panel"></div>
  <div id="timeline"></div>
</footer>

<div class="drawer-mask" id="drawer-mask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <span class="d-title" id="drawer-title">—</span>
    <span class="d-sub" id="drawer-sub"></span>
    <button class="drawer-close" id="drawer-close">×</button>
  </div>
  <div class="drawer-body" id="drawer-body">
    <div class="drawer-loading">加载中…</div>
  </div>
</aside>

<script>
let DATA = null;

/* 把当前页面 URL 的 query（线上含 sharecode 鉴权参数）透传到接口请求；本地无 query 时保持原样 */
function api(p) {
  const qs = location.search.replace(/^\?/, '');
  if (!qs) return p;
  return p + (p.indexOf('?') >= 0 ? '&' : '?') + qs;
}

function fmt(n) { return (n === undefined || n === null) ? '—' : Number(n).toLocaleString('zh-CN'); }
function md(date) { return date.slice(5).replace('-', ''); }

/* ---------- 数据加载 ---------- */
async function loadData() {
  const res = await fetch(api('/api/data'));
  DATA = await res.json();
  renderAll();
  const s = document.getElementById('status');
  if (DATA.latest) {
    s.textContent = '数据截至 ' + DATA.latest.date + ' · ' + DATA.stats.n_days + ' 个交易日';
    s.className = 'status ok';
  } else {
    s.textContent = '暂无数据';
    s.className = 'status err';
  }
}

async function refresh() {
  const btn = document.getElementById('refresh');
  const st = document.getElementById('status');
  btn.disabled = true; btn.textContent = '刷新中…'; st.textContent = '正在采集最新数据…'; st.className = 'status';
  try {
    const res = await fetch(api('/api/refresh'), { method: 'POST' });
    const r = await res.json();
    if (r.ok) {
      await loadData();
      let msg = '已更新至 ' + r.date + '（' + r.n_plates + ' 板块）';
      if (!r.n_stocks) msg += '；成分股当日未归档，票池保持旧数据';
      st.textContent = msg;
      st.className = 'status';
    } else {
      st.textContent = '刷新失败：' + (r.error || '未知错误');
      st.className = 'status err';
    }
  } catch (e) {
    st.textContent = '刷新失败：' + e.message;
    st.className = 'status err';
  } finally {
    btn.disabled = false; btn.textContent = '刷新数据';
  }
}

/* ---------- Tab 切换 ---------- */
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + t.dataset.tab).classList.add('active');
    document.getElementById('detail').classList.remove('show');
  });
});
document.getElementById('refresh').addEventListener('click', refresh);

// 每日题材轮动明细：折叠/展开（默认收起，让位给高频板块）
document.getElementById('daily-toggle').addEventListener('click', function () {
  const body = document.getElementById('daily-body');
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : '';
  this.classList.toggle('open', !open);
});

/* ---------- 渲染总入口 ---------- */
function renderAll() {
  renderWheel();
  renderMood();
  renderReport();
  renderStockPool();
  renderFreq();
}

/* ---------- 题材轮动（日历墙） ---------- */
function entryEl(item, kind) {
  const el = document.createElement('div');
  el.className = 'entry ' + kind;
  el.dataset.name = item.name;
  const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = item.name;
  const val = document.createElement('span'); val.className = 'val'; val.textContent = fmt(item.strength);
  el.appendChild(nm); el.appendChild(val);
  el.addEventListener('click', () => selectPlate(item.name));
  return el;
}

function renderWheel() {
  const grid = document.getElementById('grid');
  document.getElementById('wheel-stats').textContent = DATA.stats.n_days + ' 个交易日 · ' + DATA.stats.n_records + ' 条记录 · ' + DATA.stats.n_plates + ' 个题材';
  document.getElementById('daily-count').textContent = '· ' + DATA.stats.n_days + ' 个交易日';
  grid.innerHTML = '';
  if (!DATA.days.length) { grid.innerHTML = '<div class="empty-tip">暂无数据，点右上角「刷新数据」采集</div>'; return; }
  DATA.days.forEach(day => {
    const card = document.createElement('div'); card.className = 'card';
    const head = document.createElement('div'); head.className = 'card-head'; head.textContent = md(day.date);
    card.appendChild(head);
    const entries = document.createElement('div'); entries.className = 'entries';
    day.strong.forEach(it => entries.appendChild(entryEl(it, 'strong')));
    if (day.weak.length) {
      const div = document.createElement('div'); div.className = 'divider'; div.textContent = '弱势题材';
      entries.appendChild(div);
    }
    day.weak.forEach(it => entries.appendChild(entryEl(it, 'weak')));
    card.appendChild(entries);
    grid.appendChild(card);
  });
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const f = document.getElementById('filter').value;
  document.querySelectorAll('.entry').forEach(e => {
    const name = e.dataset.name;
    const isStrong = e.classList.contains('strong');
    const matchQ = !q || name.toLowerCase().indexOf(q) >= 0;
    const matchF = f === 'all' || (f === 'strong' ? isStrong : !isStrong);
    e.style.display = (matchQ && matchF) ? '' : 'none';
  });
  document.querySelectorAll('.card').forEach(c => {
    const weakV = Array.from(c.querySelectorAll('.entry.weak')).some(e => e.style.display !== 'none');
    const strongV = Array.from(c.querySelectorAll('.entry.strong')).some(e => e.style.display !== 'none');
    const div = c.querySelector('.divider');
    if (div) div.style.display = weakV ? '' : 'none';
    c.style.display = (weakV || strongV) ? '' : 'none';
  });
}

let selectedName = null;
function selectPlate(name) {
  selectedName = name;
  document.querySelectorAll('.entry').forEach(e => e.classList.toggle('hl', e.dataset.name === name));
  const footer = document.getElementById('detail');
  footer.classList.add('show');
  renderDetail(name);
  renderTimeline(name);
}

function renderDetail(name) {
  const panel = document.getElementById('detail-panel');
  const series = DATA.series[name] || {};
  const dates = DATA.days.map(d => d.date);
  let upDays = 0, downDays = 0;
  for (let i = 0; i < dates.length; i++) { const v = series[dates[i]]; if (v === undefined || v <= 0) break; upDays++; }
  for (let i = 0; i < dates.length; i++) { const v = series[dates[i]]; if (v === undefined || v >= 0) break; downDays++; }
  const cur = series[dates[0]];
  panel.innerHTML = '';
  const title = document.createElement('div'); title.className = 'dp-title'; title.textContent = name;
  const meta = document.createElement('div'); meta.className = 'dp-meta';
  meta.innerHTML = '上涨 <span class="u">' + upDays + '</span> 天 · 回调 <span class="d">' + downDays + '</span> 天 · 当前强度 <b>' + fmt(cur) + '</b>';
  panel.appendChild(title); panel.appendChild(meta);
}

function renderTimeline(name) {
  const tl = document.getElementById('timeline');
  const series = DATA.series[name] || {};
  const dates = DATA.days.map(d => d.date);
  tl.innerHTML = '<div class="tl-label">' + name + ' 轮动轨迹（近 ' + dates.length + ' 个交易日）</div>';
  const cells = document.createElement('div'); cells.id = 'tl-cells';
  dates.forEach(d => {
    const v = series[d];
    const cell = document.createElement('div');
    cell.className = 'tcell ' + (v === undefined ? 'empty' : (v > 0 ? 'up' : 'down'));
    const td = document.createElement('span'); td.className = 'td'; td.textContent = md(d);
    const tv = document.createElement('span'); tv.className = 'tv'; tv.textContent = fmt(v);
    cell.appendChild(td); cell.appendChild(tv);
    cells.appendChild(cell);
  });
  tl.appendChild(cells);
}

document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('filter').addEventListener('change', applyFilters);

/* ---------- 情绪温度 ---------- */
function tempColor(t) {
  if (t === null || t === undefined) return '#9aa3ad';
  if (t <= 40) return '#0ca678';
  if (t >= 60) return '#e03131';
  return '#f08c00';
}
function tempState(t) {
  if (t === null || t === undefined) return '数据缺失';
  if (t <= 40) return '冰点 · 低温';
  if (t >= 60) return '高温 · 亢奋';
  return '中性 · 震荡';
}

function lineChartSVG(series) {
  const W = 860, H = 300, left = 56, right = 828, top = 30, bottom = 256;
  const y = t => bottom - (t / 100) * (bottom - top);
  const parts = [];
  // 绿/橙/红三色背景分区（冰点/中性/高温）
  parts.push('<rect x="' + left + '" y="' + top + '" width="' + (right - left) + '" height="' + (y(60) - top).toFixed(1) + '" fill="rgba(224,49,49,0.07)"/>');
  parts.push('<rect x="' + left + '" y="' + y(60).toFixed(1) + '" width="' + (right - left) + '" height="' + (y(40) - y(60)).toFixed(1) + '" fill="rgba(240,140,0,0.07)"/>');
  parts.push('<rect x="' + left + '" y="' + y(40).toFixed(1) + '" width="' + (right - left) + '" height="' + (bottom - y(40)).toFixed(1) + '" fill="rgba(12,166,120,0.07)"/>');
  parts.push('<text x="' + (right - 4) + '" y="' + (y(80) + 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="#e03131" opacity="0.5">高温</text>');
  parts.push('<text x="' + (right - 4) + '" y="' + (y(50) + 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="#f08c00" opacity="0.5">中性</text>');
  parts.push('<text x="' + (right - 4) + '" y="' + (y(20) + 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="#0ca678" opacity="0.5">冰点</text>');
  // 网格线 + Y 轴刻度
  [0, 20, 40, 60, 80, 100].forEach(t => {
    const yy = y(t);
    parts.push('<line x1="' + left + '" y1="' + yy.toFixed(1) + '" x2="' + right + '" y2="' + yy.toFixed(1) + '" stroke="#e9e6df"/>');
    parts.push('<text x="' + (left - 8) + '" y="' + (yy + 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="#7b8794">' + t + '</text>');
  });
  const n = series.length;
  const pts = [];
  series.forEach((item, i) => {
    if (item.temperature === null || item.temperature === undefined) return;
    const x = left + (right - left) * (n > 1 ? i / (n - 1) : 0.5);
    pts.push({ x, y: y(item.temperature), t: item.temperature, d: item.date });
  });
  if (!pts.length) {
    parts.push('<text x="' + ((left + right) / 2) + '" y="' + (top + 70) + '" text-anchor="middle" font-size="13" fill="#9aa3ad">暂无有效温度数据</text>');
  }
  // 面积填充
  if (pts.length >= 2) {
    const area = 'M' + pts[0].x.toFixed(1) + ',' + y(0).toFixed(1) +
      ' L' + pts.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' L') +
      ' L' + pts[pts.length - 1].x.toFixed(1) + ',' + y(0).toFixed(1) + ' Z';
    parts.push('<path d="' + area + '" fill="rgba(77,89,103,0.08)"/>');
  }
  // 折线
  if (pts.length >= 2) {
    parts.push('<polyline points="' + pts.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ') + '" fill="none" stroke="#4d5967" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>');
  }
  // 数据点 + 数值标注 + 日期 + hover 热区（点数多时隔几个标注，避免重叠）
  const labelStep = Math.max(1, Math.ceil(pts.length / 12));
  pts.forEach((p, idx) => {
    const c = tempColor(p.t);
    const showLabel = idx % labelStep === 0 || idx === pts.length - 1;
    if (showLabel) {
      const labelY = p.y >= 40 ? p.y - 12 : p.y + 22;
      parts.push('<text x="' + p.x.toFixed(1) + '" y="' + labelY.toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="700" fill="' + c + '">' + p.t.toFixed(1) + '</text>');
    }
    parts.push('<circle class="pt" data-d="' + p.d + '" data-t="' + p.t + '" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="5" fill="' + c + '" stroke="#fff" stroke-width="2"/>');
    parts.push('<circle class="pt" data-d="' + p.d + '" data-t="' + p.t + '" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="16" fill="transparent"/>');
    if (showLabel) {
      parts.push('<text x="' + p.x.toFixed(1) + '" y="' + (bottom + 22) + '" text-anchor="middle" font-size="11" fill="#7b8794">' + md(p.d) + '</text>');
    }
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">' + parts.join('') + '</svg>';
}

function renderLadder() {
  const L = DATA.ladder;
  if (!L) return '';
  const rungs = L.ladder || [];
  const maxBoard = L.max_board || 0;
  const firstCount = L.first_board_count || 0;
  const head = '<h2>连板梯队' +
    '<span class="sub">' + (maxBoard ? '最高 ' + maxBoard + ' 板 · ' : '') + '首板 ' + firstCount + ' 只</span>' +
    '</h2>';
  if (!rungs.length) {
    return '<div class="mood-card">' + head +
      '<div class="ladder-empty">暂无 2 板及以上连板（当日首板 ' + firstCount + ' 只）</div></div>';
  }
  let body = '';
  rungs.forEach(function (r) {
    const chips = (r.stocks || []).map(function (s) {
      return '<span class="ladder-chip"><span class="lc-name">' + (s.name || '') + '</span><span class="lc-code">' + (s.code || '') + '</span></span>';
    }).join('');
    body += '<div class="ladder-rung">' +
      '<div class="ladder-board">' + r.board + '<span class="b-unit">板</span></div>' +
      '<div class="ladder-stocks">' + chips + '</div>' +
      '</div>';
  });
  return '<div class="mood-card">' + head + body + '</div>';
}

function renderAbnormal() {
  const A = DATA.abnormal;
  if (!A) return '';
  const list = A.abnormal || [];
  const total = A.total || 0;
  const head = '<h2>严重异动' +
    '<span class="sub">偏离值预警' + (total ? ' · 监控池 ' + total + ' 只' : '') + '</span>' +

  }

    body += '<div class="abn-item">' +

  return '<div class="mood-card">' + head + body + '</div>';
}

function bindMoodTooltip() {
  const sec = document.getElementById('tab-mood');
  const svg = sec.querySelector('svg');
  if (!svg) return;
  if (!window._moodTip) {
    window._moodTip = document.createElement('div');
    window._moodTip.className = 'chart-tip';
    document.body.appendChild(window._moodTip);
  }
  const tip = window._moodTip;
  svg.querySelectorAll('.pt').forEach(el => {
    el.addEventListener('mouseenter', () => {
      tip.innerHTML = '<b>' + el.dataset.d + '</b><br>温度 ' + el.dataset.t + ' · ' + tempState(+el.dataset.t);
      tip.style.display = 'block';
    });
    el.addEventListener('mousemove', e => {
      tip.style.left = (e.clientX + 14) + 'px';
      tip.style.top = (e.clientY - 40) + 'px';
    });
    el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

/* ---------- 数字报表 ---------- */
function fmtPct(n) {
  if (n === undefined || n === null) return '—';
  const v = Number(n);
  return (v > 0 ? '+' : '') + v.toFixed(2) + '%';
}

function valCls(v) {
  const n = Number(v) || 0;
  return n > 0 ? 'up' : (n < 0 ? 'down' : 'flat');
}

function plateRankCard(title, sub, items, key, fmtFn, colorMode) {
  if (!items || !items.length) return '';
  const li = items.map(function (p, i) {
    const v = Number(p[key]);
    const cls = colorMode === 'flat' ? 'flat' : valCls(v);
    return '<li><span class="rnm">' + (i + 1) + '. ' + p.name + '<span class="rcode">' + (p.code || '') + '</span></span>' +
      '<span class="rval ' + cls + '">' + fmtFn(v) + '</span></li>';
  }).join('');
  return '<div class="r-card"><h2>' + title + (sub ? ' <span class="sub">' + sub + '</span>' : '') + '</h2><ul class="rank-list">' + li + '</ul></div>';
}

function mainlineCard() {
  const freq = DATA.plate_frequency || [];
  const frequent = freq.filter(function (f) { return f.rank_days >= 2; }).slice(0, 8);
  if (!frequent.length) return '';
  const rows = frequent.map(function (f) {
    const dots = (f.daily || []).map(function (v) {
      return '<span class="dot' + (v ? ' on' : '') + '"></span>';
    }).join('');
    return '<div class="mainline-row" data-name="' + f.name + '" data-code="' + f.code + '" title="点击查看核心票">' +
      '<span class="ml-dots">' + dots + '</span>' +
      '<span class="ml-nm">' + f.name + '</span>' +
      '<span class="ml-cnt">' + f.rank_days + '次</span>' +
    '</div>';
  }).join('');
  return '<div class="r-card"><h2>近10日主线 <span class="sub">进入走强榜 top15 次数 · 点击看核心票</span></h2>' + rows + '</div>';
}

function stockRankCard() {
  const pool = DATA.stock_pool;
  if (!pool || !pool.plates) return '';
  const seen = {};
  const all = [];
  pool.plates.forEach(function (p) {
    (p.leaders || []).forEach(function (s) {
      if (!seen[s.code]) { seen[s.code] = true; all.push(s); }
    });
  });
  all.sort(function (a, b) { return (Number(b.change_pct) || 0) - (Number(a.change_pct) || 0); });
  const top = all.slice(0, 10);
  if (!top.length) return '';
  const li = top.map(function (s) {
    const c = Number(s.change_pct) || 0;
    const cls = c > 0 ? 'up' : (c < 0 ? 'down' : 'flat');
    const board = s.board ? '<span class="sr-tag">' + s.board + '</span>' : '';
    return '<li><span class="sr-code">' + s.code + '</span>' +
      '<span class="sr-nm">' + s.name + '</span>' + board +
      '<span class="sr-val ' + cls + '">' + (c > 0 ? '+' : '') + c.toFixed(2) + '%</span></li>';
  }).join('');
  return '<div class="r-card"><h2>全市场领涨股 <span class="sub">按当日涨幅</span></h2><ul class="rank-list stock-rank">' + li + '</ul></div>';
}

function renderPlateTrend(name) {
  // 近 N 日走势：上=净值曲线（逐日复利累积涨跌幅，基准 100） 下=涨跌幅柱（红涨绿跌）
  const cs = (DATA.change_series || {})[name] || {};
  const dates = DATA.days.map(function (d) { return d.date; }).slice(0, 10).reverse();
  const pts = dates.filter(function (d) { return cs[d] != null; });
  if (!pts.length) return '<div class="trend-empty">暂无该板块近期数据</div>';

  // 净值：基准日 100，逐日 ×(1 + 涨跌幅/100)
  let acc = 100;
  const nav = pts.map(function (d) {
    acc = acc * (1 + (cs[d] || 0) / 100);
    return { date: d, nav: acc };
  });

  const W = 660, H = 300;
  const left = 56, right = 636;
  const top1 = 16, bottom1 = 152;    // 净值曲线区
  const top2 = 184, bottom2 = 250;   // 涨跌幅柱区
  const xAxisY = 278;
  const n = nav.length;
  const slot = (right - left) / n;
  const cx = function (i) { return left + slot * i + slot / 2; };

  // 净值 Y 映射（含 100 基准，留 12% padding）
  const navVals = nav.map(function (p) { return p.nav; });
  let nvMin = Math.min.apply(null, navVals.concat([100]));
  let nvMax = Math.max.apply(null, navVals.concat([100]));
  if (nvMin === nvMax) { nvMin -= 1; nvMax += 1; }
  const nvPad = (nvMax - nvMin) * 0.12;
  nvMin -= nvPad; nvMax += nvPad;
  const navY = function (v) { return top1 + (nvMax - v) / (nvMax - nvMin) * (bottom1 - top1); };

  // 涨跌幅柱 Y 映射
  let maxAbs = 0;
  pts.forEach(function (d) { const v = Math.abs(cs[d] || 0); if (v > maxAbs) maxAbs = v; });
  if (maxAbs === 0) maxAbs = 1;
  const zeroY = (top2 + bottom2) / 2;
  const barH = (bottom2 - top2) / 2 - 6;
  const barW = Math.min(slot * 0.52, 26);

  // 净值折线 + 面积填充 + 末端标注
  let linePts = '', areaPath = '';
  nav.forEach(function (p, i) {
    const x = cx(i), y = navY(p.nav);
    linePts += (linePts ? ' ' : '') + x.toFixed(1) + ',' + y.toFixed(1);
    if (i === 0) areaPath = 'M ' + x.toFixed(1) + ' ' + y.toFixed(1);
    else areaPath += ' L ' + x.toFixed(1) + ' ' + y.toFixed(1);
  });
  areaPath += ' L ' + cx(n - 1).toFixed(1) + ' ' + bottom1.toFixed(1) +
              ' L ' + cx(0).toFixed(1) + ' ' + bottom1.toFixed(1) + ' Z';
  const last = nav[n - 1];
  const navDot = '<circle cx="' + cx(n - 1).toFixed(1) + '" cy="' + navY(last.nav).toFixed(1) + '" r="3.4" fill="#f08c00" stroke="#fff" stroke-width="1.5"/>' +
    '<text x="' + (cx(n - 1) - 8).toFixed(1) + '" y="' + (navY(last.nav) - 8).toFixed(1) + '" font-size="11" font-weight="700" fill="#f08c00" text-anchor="end">' + last.nav.toFixed(1) + '</text>';

  // 涨跌幅柱
  let bars = '';
  pts.forEach(function (d, i) {
    const x = cx(i), chg = cs[d] || 0;
    let y1, y2, fill;
    if (chg > 0) { y1 = zeroY - (Math.abs(chg) / maxAbs) * barH; y2 = zeroY; fill = '#e03131'; }
    else if (chg < 0) { y1 = zeroY; y2 = zeroY + (Math.abs(chg) / maxAbs) * barH; fill = '#0ca678'; }
    else { y1 = zeroY - 1; y2 = zeroY + 1; fill = '#d3cec4'; }
    bars += '<rect x="' + (x - barW / 2).toFixed(1) + '" y="' + y1.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + Math.max(1.5, (y2 - y1)).toFixed(1) + '" rx="1.5" fill="' + fill + '"><title>' + d + ' 涨跌 ' + (chg > 0 ? '+' : '') + chg + '%</title></rect>';
  });

  // 净值左轴刻度（nvMax / 100 / nvMin）
  const navTicks = [nvMax, 100, nvMin].filter(function (v, i, a) { return a.indexOf(v) === i; }).sort(function (a, b) { return b - a; });
  let navAxis = '';
  navTicks.forEach(function (v) {
    const isBase = Math.abs(v - 100) < 0.001;
    navAxis += '<text x="' + (left - 8) + '" y="' + (navY(v) + 3).toFixed(1) + '" font-size="10" fill="' + (isBase ? '#e03131' : '#9a958c') + '" text-anchor="end">' + v.toFixed(1) + '</text>';
  });

  // 涨跌幅左轴刻度
  const chgAxis = '<text x="' + (left - 8) + '" y="' + (top2 + 4) + '" font-size="10" fill="#e03131" text-anchor="end">+' + (maxAbs >= 10 ? maxAbs.toFixed(0) : maxAbs.toFixed(1)) + '%</text>' +
    '<text x="' + (left - 8) + '" y="' + (zeroY + 3) + '" font-size="10" fill="#9a958c" text-anchor="end">0</text>' +
    '<text x="' + (left - 8) + '" y="' + (bottom2 - 1) + '" font-size="10" fill="#0ca678" text-anchor="end">-' + (maxAbs >= 10 ? maxAbs.toFixed(0) : maxAbs.toFixed(1)) + '%</text>';

  // X 轴日期（隔一个标）
  let xLabels = '';
  nav.forEach(function (p, i) {
    if (n <= 6 || i % 2 === 0) {
      xLabels += '<text x="' + cx(i).toFixed(1) + '" y="' + xAxisY + '" font-size="10" fill="#9a958c" text-anchor="middle">' + p.date.slice(5).replace('-', '/') + '</text>';
    }
  });

  const svg = '<svg class="trend-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
    // 净值区浅底 + 100 基准虚线
    '<rect x="' + left + '" y="' + top1 + '" width="' + (right - left) + '" height="' + (bottom1 - top1) + '" fill="#fbfaf7" rx="4"/>' +
    '<line x1="' + left + '" y1="' + navY(100).toFixed(1) + '" x2="' + right + '" y2="' + navY(100).toFixed(1) + '" stroke="#e6e3dc" stroke-width="1" stroke-dasharray="3 3"/>' +
    '<path d="' + areaPath + '" fill="rgba(240,140,0,0.10)" stroke="none"/>' +
    '<polyline points="' + linePts + '" fill="none" stroke="#f08c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    navDot +
    // 主/副图分隔线 + 副图 0 轴
    '<line x1="' + left + '" y1="' + (bottom1 + 14) + '" x2="' + right + '" y2="' + (bottom1 + 14) + '" stroke="#f0ede6" stroke-width="1"/>' +
    '<line x1="' + left + '" y1="' + zeroY + '" x2="' + right + '" y2="' + zeroY + '" stroke="#e6e3dc" stroke-width="1"/>' +
    bars +
    navAxis + chgAxis + xLabels +
    '</svg>';

  const navChg = last.nav - 100;
  const navChgClr = navChg >= 0 ? '#e03131' : '#0ca678';
  const legend = '<div class="trend-head">' +
    '<span class="trend-title">' + name + '<span class="tag">近 ' + n + ' 日走势 · 净值 <b style="color:#f08c00">' + last.nav.toFixed(1) + '</b>（<b style="color:' + navChgClr + '">' + (navChg >= 0 ? '+' : '') + navChg.toFixed(1) + '%</b>）</span></span>' +
    '<span class="trend-legend"><span><i class="lg-line"></i>净值曲线</span><span><i class="lg-bar bar"></i><i class="lg-bar down" style="margin-left:2px"></i>涨跌幅</span></span>' +
    '<button class="trend-pool-btn" type="button" data-name="' + name + '" data-code="' + (function () { const f = (DATA.plate_frequency || []).find(function (x) { return x.name === name; }); return f ? f.code : ''; })() + '">查看核心票 →</button>' +
  '</div>';
  return '<div class="trend-wrap">' + legend + svg + '</div>';
}

  const freq = DATA.plate_frequency || [];
  // 只保留上榜 ≥ 2 天的「频繁」板块，且最多展示前 12 个
  const frequent = freq.filter(function (f) { return f.rank_days >= 2; }).slice(0, 12);
  if (!frequent.length) {
    board.innerHTML = '';
    return;
  }
  const windowDays = 10;

  // 龙头映射（取自核心票池）
  const poolMap = {};
  if (DATA.stock_pool && DATA.stock_pool.plates) {
    DATA.stock_pool.plates.forEach(function (p) { poolMap[p.name] = p; });

  let html = '<div class="freq-board-head">' +

    '<span class="freq-board-sub">进入走强榜 top15 的次数 · 红点=当日上榜 · 点击展开走势图</span>' +
    '<span class="freq-board-meta">共 <b>' + frequent.length + '</b> 条主线</span>' +
  '</div>';
  html += '<table class="freq-table"><thead><tr>' +
    '<th class="c-rank">#</th>' +
    '<th class="c-plate">板块</th>' +
    '<th class="c-dots">近' + windowDays + '日上榜节奏</th>' +
    '<th class="c-cnt">上榜次数</th>' +
    '<th class="c-str">最新强度</th>' +
  '</tr></thead><tbody>';

  frequent.forEach(function (f, i) {
    const s = f.last_strength || 0;
    const sCls = s > 0 ? 'up' : (s < 0 ? 'down' : 'flat');
    const sTxt = s > 0 ? '+' + fmt(s) : fmt(s);
    const rankCls = i < 3 ? ' r' + (i + 1) : '';
    const p = poolMap[f.name];
    const lead = (p && p.leaders && p.leaders.length)
      ? p.leaders.slice(0, 2).map(function (x) { return x.name; }).join('、') : '';
    const dots = (f.daily || []).map(function (v) {
      return '<span class="dot' + (v ? ' on' : '') + '" title="' + (v ? '上榜' : '未上榜') + '"></span>';
    }).join('');
    html += '<tr data-name="' + f.name + '" data-code="' + f.code + '" title="点击展开「' + f.name + '」近10日走势图">' +
      '<td style="text-align:center"><span class="rank-badge' + rankCls + '">' + (i + 1) + '</span></td>' +
      '<td><span class="freq-plate"><span class="freq-name">' + f.name + '<span class="code">' + (f.code || '') + '</span></span>' +
        (lead ? '<span class="freq-lead"><span class="lbl">龙头</span> <span class="nm">' + lead + '</span></span>' : '') +
      '</span></td>' +
      '<td style="text-align:center"><span class="freq-dots">' + dots + '</span></td>' +
      '<td class="freq-cnt">' + f.rank_days + '<span class="unit">次</span></td>' +
      '<td class="freq-strength ' + sCls + '">' + sTxt + '</td>' +
    '</tr>';
  });
  html += '</tbody></table>';
  board.innerHTML = html;
  // 点击整行：展开/收起该板块近10日走势图（再点收起）
  board.querySelectorAll('tbody tr').forEach(function (row) {
    row.addEventListener('click', function () {
      const next = row.nextElementSibling;
      const wasOpen = next && next.classList.contains('trend-row');
      board.querySelectorAll('tbody tr.trend-row').forEach(function (tr) { tr.remove(); });
      board.querySelectorAll('tbody tr').forEach(function (r) { r.classList.remove('active'); });
      if (wasOpen) return; // 原本展开 → 本次点击即收起
      row.classList.add('active');
      selectPlate(row.dataset.name);
      const tr = document.createElement('tr');
      tr.className = 'trend-row';
      const td = document.createElement('td');
      td.colSpan = 5;
      td.innerHTML = renderPlateTrend(row.dataset.name);
      tr.appendChild(td);
      row.insertAdjacentElement('afterend', tr);
      td.querySelectorAll('.trend-pool-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          openPlateStocks(btn.dataset.name, btn.dataset.code);
        });
      });
    });
  });
}

function openPlateStocks(name, code) {
  const drawer = document.getElementById('drawer');
  const mask = document.getElementById('drawer-mask');
  document.getElementById('drawer-title').textContent = name;
  document.getElementById('drawer-sub').textContent = '核心票池 · 加载中';
  document.getElementById('drawer-body').innerHTML = '<div class="drawer-loading">正在拉取「' + name + '」成分股…</div>';
  drawer.classList.add('show');
  mask.classList.add('show');

  fetch(api('/api/plate_stocks?code=' + encodeURIComponent(code)))
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data.ok) {
        document.getElementById('drawer-body').innerHTML = '<div class="drawer-loading">拉取失败：' + (data.error || '未知错误') + '</div>';
        document.getElementById('drawer-sub').textContent = '加载失败';
        return;
      }
      document.getElementById('drawer-sub').textContent = data.date + ' · ' + data.n_stocks + ' 只成分股';
      renderDrawerStocks(data);
    })
    .catch(function (e) {
      document.getElementById('drawer-body').innerHTML = '<div class="drawer-loading">拉取失败：' + e.message + '</div>';
      document.getElementById('drawer-sub').textContent = '加载失败';
    });
}

function renderDrawerStocks(data) {
  const body = document.getElementById('drawer-body');
  const stockRow = function (s, showBoard, valFn) {
    const c = Number(s.change_pct) || 0;
    const cls = c > 0 ? 'up' : (c < 0 ? 'down' : 'flat');
    const board = (showBoard && s.board) ? '<span class="stag">' + s.board + '</span>' : '';
    return '<div class="d-stock">' +
      '<span class="scode">' + s.code + '</span>' +
      '<span class="sname">' + s.name + '</span>' + board +
      '<span class="sval ' + cls + '">' + valFn(s, c) + '</span>' +
    '</div>';
  };
  let html = '';
  if (data.leaders && data.leaders.length) {
    html += '<div class="d-sec"><div class="d-sec-title lead">领涨 · 题材先锋</div>';
    html += data.leaders.map(function (s) {
      const c = Number(s.change_pct) || 0;
      return stockRow(s, true, function () { return (c > 0 ? '+' : '') + c + '%'; });
    }).join('');
    html += '</div>';
  }
  if (data.generals && data.generals.length) {
    html += '<div class="d-sec"><div class="d-sec-title gen">中军 · 大票权重</div>';
    html += data.generals.map(function (s) {
      return stockRow(s, false, function () { return fmtAmt(s.turnover); });
    }).join('');
    html += '</div>';
  }
  if (!html) html = '<div class="drawer-loading">该板块暂无成分股数据</div>';
  body.innerHTML = html;
}

document.getElementById('drawer-close').addEventListener('click', function () {
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('drawer-mask').classList.remove('show');
});
document.getElementById('drawer-mask').addEventListener('click', function () {
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('drawer-mask').classList.remove('show');
});

loadData();
</script>
</body>
</html>
